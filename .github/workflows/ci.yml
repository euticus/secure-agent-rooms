name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (incl. security regression suite)
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high || true
      - name: Secret scan (tracked files)
        run: |
          ! grep -rInE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            --include='*.ts' --include='*.tsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=test --exclude-dir=.next . \
            || (echo 'possible secret in tree' && exit 1)
