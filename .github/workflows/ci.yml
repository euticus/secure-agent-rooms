name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose — the action reads it from the
      # `packageManager` field in package.json, and specifying both is a hard
      # error. One source of truth for the pnpm version.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (incl. security regression suite)
        run: pnpm test
      # Advisory only: Dependabot alerts are the enforcing mechanism (they scan
      # the lockfile continuously and open PRs). This just surfaces problems in
      # the PR itself, so it must not fail the build on a fresh advisory.
      - name: Dependency audit (advisory)
        run: pnpm audit --prod --audit-level high || true
      - name: Secret scan (tracked files)
        run: |
          ! grep -rInE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            --include='*.ts' --include='*.tsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=test --exclude-dir=.next . \
            || (echo 'possible secret in tree' && exit 1)

  # The Dockerfiles are how this actually ships, but nothing above touches them:
  # the steps run on the runner's own Node, not the image's. A base-image change
  # that cannot build (node:26-slim no longer bundles corepack, so `corepack
  # enable` exits 127) therefore passed every check above and would have failed
  # only mid-deploy. Building both images here closes that gap.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: booth-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: booth-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building proves it compiles; this proves it boots and serves.
      - name: API image starts and answers
        run: |
          docker run -d --name api -p 4000:4000 \
            -e BOOTH_ENV=test -e PORT=4000 -e HOST=0.0.0.0 booth-api:ci
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/healthz)" = "200" ]; then
              echo "healthy on $(docker exec api node -v)"; exit 0
            fi
            sleep 2
          done
          echo "API image never became healthy"; docker logs api; exit 1
